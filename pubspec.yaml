name: meetday_app
description: "Meetday mobile app for events, communities, and sponsorships."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  google_maps_flutter: ^2.18.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  json_serializable: ^6.14.1
  mobile_scanner: ^7.4.2
  shimmer: ^3.0.0
  socket_io_client: ^3.1.6

dev_dependencies:
  build_runner: ^2.7.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Add custom fonts later if needed.
  # fonts:
  #   - family: MeetdaySans
  #     fonts:
  #       - asset: assets/fonts/MeetdaySans-Regular.ttf
